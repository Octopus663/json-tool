spring.application.name=json-tool

# Optional local overrides (not committed, see .gitignore)
spring.config.import=optional:file:./application-local.properties

# MySQL database settings (provide credentials via environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jsontooldb}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Credentials for the REST API (HTTP Basic)
app.api.username=${API_USERNAME:admin}
app.api.password=${API_PASSWORD:}
